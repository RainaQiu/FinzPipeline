name: Weekly shared demo reset

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FINZ_DEMO_BASE_URL: ${{ vars.FINZ_DEMO_BASE_URL }}
      FINZ_DEMO_RESET_SECRET: ${{ secrets.FINZ_DEMO_RESET_SECRET }}
    steps:
      - name: Validate reset configuration
        id: validate_config
        shell: bash
        run: |
          if [[ -z "${FINZ_DEMO_RESET_SECRET}" ]]; then
            echo "::warning::FINZ_DEMO_RESET_SECRET is not configured; skipping reset"
            echo "should_reset=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "${FINZ_DEMO_BASE_URL}" =~ ^https://[^/[:space:]]+ ]]; then
            echo "::error::FINZ_DEMO_BASE_URL must be a non-empty HTTPS URL"
            exit 1
          fi
          echo "should_reset=true" >> "$GITHUB_OUTPUT"
      - name: Reset shared demo workspace
        if: steps.validate_config.outputs.should_reset == 'true'
        shell: bash
        run: >
          curl --silent --show-error --fail-with-body
          --max-time 30 --retry 2 --retry-delay 5 --retry-all-errors
          -X POST
          -H "X-Finz-Reset-Secret: ${FINZ_DEMO_RESET_SECRET}"
          "${FINZ_DEMO_BASE_URL%/}/api/v1/admin/reset"
