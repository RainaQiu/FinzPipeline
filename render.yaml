services:
  - type: web
    name: finz-public-demo
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && corepack enable && corepack prepare pnpm@11.9.0 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: FRONTEND_STATIC_DIR
        value: frontend/dist
      - key: FINZ_REPOSITORY_BACKEND
        value: mongo
      - key: APP_BASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: finz_ledger_bridge
      - key: QBO_CLIENT_ID
        sync: false
      - key: QBO_CLIENT_SECRET
        sync: false
      - key: QBO_REDIRECT_URI
        sync: false
      - key: FINZ_DEMO_RESET_SECRET
        sync: false
