services:
  - type: web
    name: finz-public-demo
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && pnpm install --frozen-lockfile && pnpm build
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENVIRONMENT
        value: demo
      - key: FRONTEND_STATIC_DIR
        value: frontend/dist
      - key: FINZ_REPOSITORY_BACKEND
        value: memory
      - key: APP_BASE_URL
        value: https://finz-public-demo.onrender.com
      - key: MONGODB_DATABASE
        value: finz_ledger_bridge
      - key: QBO_EXPECTED_COMPANY_NAME
        value: BrightFix Home Services LLC
      - key: QBO_SANDBOX_WRITES_ENABLED
        value: "false"
      - key: GEMINI_ENABLED
        value: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MAX_CANDIDATES_PER_UPLOAD
        value: 10
